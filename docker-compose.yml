version: '3.8'

services:
  # Base de Datos Relacional Única (RNF-07)
  postgres:
    image: postgres:16-alpine
    container_name: sigem-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: emergencias_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d emergencias_db']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
